{% extends "layout.html" %}

{% block title %}Muokkaa reseptiä{% endblock %}

{% block content %}
    <h2>Muokkaa reseptiä</h2>

    <form action="/update_recipe/{{ recipe.id }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <p>
            Reseptin nimi (max 100 merkkiä):<br>
            <input type="text" name="title" value="{{ recipe.title }}" required maxlength="100">
        </p>
        <p>
            Resepti (max 5000 merkkiä):<br>
            <textarea name="content" rows="10" required maxlength="5000">{{ recipe.content }}</textarea>
        </p>
        <p>
            Kategoriat:<br>
            {% for category in categories %}
                <input type="checkbox" name="categories" value="{{ category.id }}"
                    {% if category.id in current_ids %}checked{% endif %}>
                {{ category.name }}<br>
            {% endfor %}
        </p>
        <input type="submit" value="Tallenna muutokset">
    </form>

    <form action="/delete_recipe/{{ recipe.id }}" method="post" onsubmit="return confirm('Haluatko varmasti poistaa tämän reseptin?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="submit" value="Poista resepti">
    </form>
{% endblock %}
