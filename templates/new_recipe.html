{% extends "layout.html" %}

{% block title %}Uusi resepti{% endblock %}

{% block content %}
    <h2>Uusi resepti</h2>

    <form action="/create_recipe" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <p>
            Reseptin nimi (max 100 merkkiä):<br>
            <input type="text" name="title" required maxlength="100">
        </p>
        <p>
            Resepti (ainesosat ja ohjeet, max 5000 merkkiä):<br>
            <textarea name="content" rows="10" required maxlength="5000"></textarea>
        </p>
        <p>
            Kategoriat:<br>
            {% for category in categories %}
                <input type="checkbox" name="categories" value="{{ category.id }}">
                {{ category.name }}<br>
            {% endfor %}
        </p>
        <input type="submit" value="Tallenna resepti">
    </form>
{% endblock %}
