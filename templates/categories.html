{% extends "layout.html" %}

{% block title %}Kategoriat{% endblock %}

{% block content %}
    <h2>Kategoriat</h2>

    {% if categories %}
        <ul>
        {% for category in categories %}
            <li>{{ category.name }} ({{ category.recipe_count }} reseptiä)</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Ei kategorioita.</p>
    {% endif %}
{% endblock %}
