{% extends "layout.html" %}

{% block title %}Luo tunnus{% endblock %}

{% block content %}
    <h2>Luo tunnus</h2>

    <form action="/register" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <p>
            Käyttäjätunnus (3-50 merkkiä):<br>
            <input type="text" name="username" value="{{ username or '' }}" required minlength="3" maxlength="50">
        </p>
        <p>
            Salasana (vähintään 5 merkkiä):<br>
            <input type="password" name="password1" required minlength="5">
        </p>
        <p>
            Salasana uudelleen:<br>
            <input type="password" name="password2" required minlength="5">
        </p>
        <input type="submit" value="Luo tunnus">
    </form>

    <p>Onko tunnus? <a href="/login">Kirjaudu sisään</a></p>
{% endblock %}
